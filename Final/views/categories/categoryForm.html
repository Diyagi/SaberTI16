<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <p class="text-muted mb-0" id="categoryId"></p>
        </div>
    </div>

    <form id="categoryForm">
        <!-- Description -->
        <div class="mb-3">
            <label for="categoryDesc" class="form-label">Descrição</label>
            <input
                type="text"
                class="form-control"
                id="categoryDesc"
                name="categoryDesc"
            >
        </div>

        <div id="formMessage"></div>

        <!-- Actions -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i>
                Salvar Alterações
            </button>

            <button
                type="button"
                class="btn btn-secondary"
                onclick="history.back()"
            >
                Cancelar
            </button>
        </div>
    </form>
</div>
