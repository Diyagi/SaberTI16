<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <script type="module" src="./assets/js/authGuard.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SaberTI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="app-body">
    <div class="app-shell" id="app-shell">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Navegação principal">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">ST</span>
          <span class="sidebar-label brand-name">SaberTI</span>
        </div>

        <nav class="sidebar-nav nav flex-column">
          <a class="sidebar-link nav-link" href="#quotes" data-route="quotes">
            <i class="fa-solid fa-receipt" aria-hidden="true"></i>
            <span class="sidebar-label">Orcamentos</span>
          </a>
          <a class="sidebar-link nav-link" href="#products" data-route="products">
            <i class="fa-solid fa-box" aria-hidden="true"></i>
            <span class="sidebar-label">Produtos</span>
          </a>
          <a class="sidebar-link nav-link" href="#categories" data-route="categories">
            <i class="fa-solid fa-tags" aria-hidden="true"></i>
            <span class="sidebar-label">Categorias</span>
          </a>
          <a class="sidebar-link nav-link" href="#clients" data-route="clients">
            <i class="fa-solid fa-users" aria-hidden="true"></i>
            <span class="sidebar-label">Clientes</span>
          </a>
          <a class="sidebar-link nav-link" href="#users" data-route="users">
            <i class="fa-solid fa-user-gear" aria-hidden="true"></i>
            <span class="sidebar-label">Usuários</span>
          </a>
        </nav>
      </aside>

      <div class="app-main">
        <header class="app-header">
          <button
            class="btn btn-light sidebar-trigger"
            id="sidebar-trigger"
            type="button"
            aria-label="Recolher menu lateral"
            aria-controls="app-sidebar"
            aria-expanded="true"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <h1 class="h4 mb-0 fw-semibold" id="page-title">Início</h1>
        </header>

        <main class="app-view" id="viewContent" tabindex="-1" aria-live="polite"></main>
      </div>
    </div>

    <script type="module" src="assets/js/menu.js"></script>
  </body>
</html>
