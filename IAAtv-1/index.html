<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Tabuada</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-5">
      <section class="tabuada-card mx-auto shadow-sm">
        <div class="p-4 p-md-5">
          <p class="text-uppercase text-primary fw-semibold small mb-2">JavaScript básico</p>
          <h1 class="h2 mb-2">Gerador de tabuada</h1>
          <p class="text-secondary mb-4">Informe um número para ver sua tabuada de 1 até 10.</p>

          <form id="form-tabuada" class="row g-3 align-items-end" novalidate>
            <div class="col-sm-8">
              <label for="numero" class="form-label fw-semibold">Número</label>
              <input
                id="numero"
                class="form-control form-control-lg"
                type="number"
                inputmode="numeric"
                placeholder="Ex.: 7"
                required
                autofocus
              />
            </div>
            <div class="col-sm-4 d-grid">
              <button class="btn btn-primary btn-lg" type="submit">Gerar tabuada</button>
            </div>
          </form>

          <p id="mensagem" class="text-danger small mt-3 mb-0" aria-live="polite"></p>

          <section class="resultado mt-4" aria-labelledby="titulo-resultado">
            <h2 id="titulo-resultado" class="h5 mb-3">Resultado</h2>
            <div id="tabuada" class="list-group" aria-live="polite">
              <p class="text-secondary mb-0">A tabuada aparecerá aqui.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
