<body>
    <div class="table-header">
        <h2>Lista de Categorias</h2>
        <button type="button" id="addCategoryBtn" class="btn btn-primary">Adicionar</button>
    </div>
    
    <table class="table table-striped table-hover table-bordered">
        <thead>
            <tr>
                <th class="column-center" scope="col">ID</th>
                <th class="column-left" scope="col">Nome</th>
                <th class="column-left" scope="col">Descrição</th>
                <th class="column-center" scope="col">Opçoes</th>
            </tr>
        </thead>
        <tbody id="categoryContent">
        </tbody>
    </table>
    
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCategoryModalLabel">
                        Adicionar Categoria
                    </h5>
                    
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                
                <form id="addCategoryForm">
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">
                                Nome
                            </label>
                            
                            <input type="text" class="form-control" id="categoryName" name="name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="categoryDescription" class="form-label">
                                Descrição
                            </label>
                            
                            <textarea class="form-control" id="categoryDescription" name="description" rows="4"></textarea>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        
                        <button type="submit" id="submitForm" class="btn btn-primary">
                            Adicionar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
