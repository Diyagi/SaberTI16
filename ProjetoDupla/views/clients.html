<body>
    <div class="table-header">
        <h2>Lista de Clientes</h2>
        <button type="button" id="addClientBtn" class="btn btn-primary">Adicionar</button>
    </div>

    <table class="table table-striped table-hover table-bordered">
        <thead>
            <tr>
                <th class="column-center" scope="col">ID</th>
                <th class="column-left" scope="col">Nome</th>
                <th class="column-left" scope="col">E-mail</th>
                <th class="column-left" scope="col">Telefone</th>
                <th class="column-left" scope="col">Endereco</th>
                <th class="column-center" scope="col">Opcoes</th>
            </tr>
        </thead>
        <tbody id="clientContent">
        </tbody>
    </table>

    <div class="modal fade" id="addClientModal" tabindex="-1" aria-labelledby="addClientModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addClientModalLabel">
                        Adicionar Cliente
                    </h5>
                    
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                
                <form id="addClientForm">
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="clientName" class="form-label">
                                Nome
                            </label>
                            
                            <input type="text" class="form-control" id="clientName" name="name" required>
                        </div>
                        
                        
                        <div class="mb-3">
                            <label for="clientEmail" class="form-label">
                                Email
                            </label>
                            
                            <input type="email" class="form-control" id="clientEmail" name="price" min="0" step="0.01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="clientPhone" class="form-label">
                                Telefone
                            </label>
                            
                            <input type="tel" class="form-control" id="clientPhone" name="price" min="0" step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="clientAddress" class="form-label">
                                Endereco
                            </label>
                            
                            <textarea class="form-control" id="clientAddress" name="description" rows="4"></textarea>
                        </div>
                        
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        
                        <button type="submit" id="submitForm" class="btn btn-primary">
                            Adicionar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
