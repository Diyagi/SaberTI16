<body>
    <div class="table-header">
        <h2>Lista de Produtos</h2>
        <button type="button" id="addProductBtn" class="btn btn-primary">Adicionar</button>
    </div>
    
    <table class="table table-striped table-hover table-bordered">
        <thead>
            <tr>
                <th class="column-center" scope="col">ID</th>
                <th class="column-left" scope="col">Nome</th>
                <th class="column-left" scope="col">Descrição</th>
                <th class="column-left" scope="col">Descrição Curta</th>
                <th class="column-left" scope="col">Categoria</th>
                <th class="column-left" scope="col">Preço</th>
                <th class="column-center" scope="col">Opcoes</th>
            </tr>
        </thead>
        <tbody id="productContent">
        </tbody>
    </table>
    
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">
                        Adicionar Produto
                    </h5>
                    
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                
                <form id="addProductForm">
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="itemName" class="form-label">
                                Nome
                            </label>
                            
                            <input type="text" class="form-control" id="itemName" name="name" required>
                        </div>
                        
                        
                        <div class="mb-3">
                            <label for="itemPrice" class="form-label">
                                Preço
                            </label>
                            
                            <input type="number" class="form-control" id="itemPrice" name="price" min="0" step="0.01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="itemCategory" class="form-label">
                                Categoria
                            </label>
                            
                            <select class="form-select" id="itemCategory" name="category" required>
                                <option value="" selected disabled>
                                    Select a category
                                </option>
                                
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="itemShortDescription" class="form-label">
                                Descrição Curta
                            </label>
                            
                            <textarea class="form-control" id="itemShortDescription" name="shortDescription" rows="2"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="itemDescription" class="form-label">
                                Descrição
                            </label>
                            
                            <textarea class="form-control" id="itemDescription" name="description" rows="4"></textarea>
                        </div>
                        
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        
                        <button type="submit" id="submitItem" class="btn btn-primary">
                            Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
