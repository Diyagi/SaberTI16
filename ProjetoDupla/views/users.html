<body>
    <div class="table-header">
        <h2>Lista de Usuarios</h2>
        <button type="button" id="addUserBtn" class="btn btn-primary">Adicionar</button>
    </div>

    <table class="table table-striped table-hover table-bordered">
        <thead>
            <tr>
                <th class="column-center" scope="col">ID</th>
                <th class="column-left" scope="col">Nome</th>
                <th class="column-left" scope="col">Login</th>
                <th class="column-left" scope="col">E-mail</th>
                <th class="column-center" scope="col">Opcoes</th>
            </tr>
        </thead>
        <tbody id="userContent">
        </tbody>
    </table>

    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addUserModalLabel">
                        Adicionar Usuario
                    </h5>
                    
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    </button>
                </div>
                
                <form id="addUserForm">
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="userName" class="form-label">
                                Nome
                            </label>
                            
                            <input type="text" class="form-control" id="userName" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="userLogin" class="form-label">
                                Login
                            </label>
                            
                            <input type="text" class="form-control" id="userLogin" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label">
                                Email
                            </label>
                            
                            <input type="email" class="form-control" id="userEmail" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label">
                                Senha
                            </label>
                            
                            <input type="password" class="form-control" id="userPassword" name="name" required>
                        </div>
                    </div>
                    
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        
                        <button type="submit" id="submitForm" class="btn btn-primary">
                            Adicionar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
