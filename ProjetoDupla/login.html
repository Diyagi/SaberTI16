<!DOCTYPE html>
<html lang="en">
<script type="module" src="../js/login.js"></script>
<script type="module" src="../js/commands.js"></script>
<link rel="stylesheet" href="../styles/style.css">
<link rel="stylesheet" href="../styles/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <form class="login-form" id="loginForm">
        <h1 class="form-header">Login</h1>
        <div class="login-input-div">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="userMail" name="userMail" placeholder="Email">
        </div>
        <div class="login-input-div">
            <i class="fa-solid fa-key input-icon"></i>
            <input type="password" id="userPass" name="userPass" placeholder="Senha">
        </div>
        <a class="forgotpass" href="https://google.com">Esqueceu sua senha?</a>

        
        <div class="btn-div">
            <button type="submit">Entrar</button>
        </div>
    </form>
</body>
</html>
