<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</head>

<body>
    <div class="mainElements">
        <form id="cadastroCliente">
            <div class="form-heading">
                <span class="eyebrow">Área de clientes</span>
                <h1>Cadastro de cliente</h1>
                <p>Preencha os dados abaixo para criar um novo cadastro.</p>
            </div>
            <div class="mb-3">
                <label class="form-label" for="nomeCliente">Nome</label>
                <input class="form-control" id="nomeCliente" type="text" name="nome" placeholder="Digite o nome completo" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="cpfcnpjCliente">CPF/CNPJ</label>
                <input class="form-control" id="cpfcnpjCliente" type="text" name="cpfcnjpj" placeholder="000.000.000-00" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="tipo">Tipo (Fisica/Juridica)</label>
                <select class="form-select" id="tipo" name="tipo">
                    <option value="F">Pessoa Fisica</option>
                    <option value="J">Pessoa Juridica</option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar cliente</button>
        </form>
        <p class="submitResult" id="submitResult" aria-live="polite"></p>
    </div>
</body>

</html>
