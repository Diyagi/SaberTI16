<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="mainElements">
        <form id="cadastroCliente">
            <h1>Cadastro de Cliente</h1>
            <div class="mb-3">
                <label class="form-label" for="nomeCliente">Nome</label>
                <input class="form-control" type="text" name="nome">
            </div>
            <div class="mb-3">
                <label class="form-label" for="cpfcnpjCliente">CPF/CNPJ</label>
                <input class="form-control" type="text" name="cpfcnjpj">
            </div>
            <div class="mb-3">
                <label class="form-label" for="tipo">Tipo (Fisica/Juridica)</label>
                <select class="form-select" name="tipo">
                    <option value="F">Pessoa Fisica</option>
                    <option value="J">Pessoa Juridica</option>
                </select>
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar</button>
        </form>
        <h2 class="submitResult" id="submitResult"></h2> 
    </div>
</body>

</html>
