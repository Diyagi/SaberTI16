<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pedido da Lanchonete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg">
    <main class="container py-5">
        <section class="card mx-auto shadow-sm" style="max-width: 680px">
            <div class="card-body p-4 p-md-5">
                <h1 class="h2 text-center mb-1">Lanchonete</h1>
                <p class="text-secondary text-center mb-4">Selecione os itens do seu pedido</p>

                <form id="pedido-form">
                    <fieldset class="mb-4">
                        <legend class="h5 mb-3">Cardápio</legend>
                        <div id="produtos" class="list-group"></div>
                    </fieldset>

                    <fieldset class="mb-4">
                        <legend class="h5 mb-3">Embalagem para entrega</legend>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="entrega" id="sem-entrega" value="0"
                                checked />
                            <label class="form-check-label" for="sem-entrega">Não, retirar no local</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="entrega" id="com-entrega" value="4" />
                            <label class="form-check-label" for="com-entrega">Sim, adicionar embalagem (R$ 4,00)</label>
                        </div>
                    </fieldset>

                    <div class="alert alert-primary d-flex justify-content-between align-items-center mb-0"
                        role="status">
                        <span class="fw-semibold">Total do pedido</span>
                        <output id="total" class="fs-4 fw-bold">R$ 0,00</output>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const produtos = [
            { nome: "Cachorro-quente", preco: 12 },
            { nome: "Bauru simples", preco: 13 },
            { nome: "Bauru com ovo", preco: 15 },
            { nome: "Hambúrguer", preco: 12 },
            { nome: "Cheeseburger", preco: 13 },
            { nome: "Refrigerante", preco: 5 }
        ];

        const moeda = new Intl.NumberFormat("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
        const listaProdutos = document.querySelector("#produtos");
        const total = document.querySelector("#total");

        produtos.forEach((produto, indice) => {
            listaProdutos.insertAdjacentHTML(
                "beforeend",
                `<label class="list-group-item d-flex justify-content-between align-items-center">
                <span><input class="form-check-input me-2 produto" type="checkbox" value="${produto.preco}" id="produto-${indice}"> ${produto.nome}</span>
                <span class="fw-semibold">${moeda.format(produto.preco)}</span>
                </label>`
            );
        });

        function atualizarTotal() {
            const itens = [...document.querySelectorAll(".produto:checked")]
                .reduce((soma, item) => soma + Number(item.value), 0);
            const entrega = Number(document.querySelector('input[name="entrega"]:checked').value);
            total.value = moeda.format(itens + entrega);
            total.textContent = moeda.format(itens + entrega);
        }

        document.querySelector("#pedido-form").addEventListener("change", atualizarTotal);
    </script>
</body>

</html>
