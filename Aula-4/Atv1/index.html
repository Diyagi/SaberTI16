<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<script src="atv1.js"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="mainElements">
        <div class="scoresDiv">
            <div class="inputDiv">
                <label for="score1">Primeiro Bimestre:</label>
                <input type="number" id="score1" name="score1">
            </div>

            <div class="inputDiv">
                <label for="score2">Segundo Bimestre:</label>
                <input type="number" id="score2" name="score2">
            </div>

            <div class="inputDiv">
                <label for="score3">Terceiro Bimestre:</label>
                <input type="number" id="score3" name="score3">
            </div>

            <div class="inputDiv">
                <label for="score4">Quarto Bimestre:</label>
                <input type="number" id="score4" name="score4">
            </div>
        </div>

        <div class="inputDiv">
            <label for="absencesInput">Faltas Totais:</label>
            <input type="number" id="absencesInput" name="absencesInput">
        </div>

        <button id="submitBtn">Calcular</button>

        <h2 id="absencesText"></h2>
        <h2 id="scoreText"></h2>
        <h1 id="resultText"></h1>
    </div>
</body>

</html>
