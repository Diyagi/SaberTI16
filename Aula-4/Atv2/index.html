<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<script src="atv2.js"></script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="months-sheet">
        <h1 class="main-title">Calculador de Valor Liquido</h1>
        <div class="months-rows" id="months-rows">
            <div class="row-header">
                <h2 class="header">Mes</h2>
                <h2 class="header">Valor Bruto</h2>
                <h2 class="header">Percentual de Desconto</h2>
                <h2 class="header">Valor Liquido</h2>
            </div>
        </div>
        <div class="total-div">
            <h1>Total Bruto:</h1>
            <h1 id="totGrossVal">R$ 0.00</h1>
        </div>
        <div class="total-div">
            <h1>Total % de Desconto:</h1>
            <h1 id="totDiscPercVal">0%</h1>
        </div>
        <div class="total-div">
            <h1>Total Liquido:</h1>
            <h1 id="totNetVal">R$ 0.00</h1>
        </div>
        <div class="btn-div">
            <button id="submitBtn">Calcular</button>
        </div>
    </div>
</body>

</html>
